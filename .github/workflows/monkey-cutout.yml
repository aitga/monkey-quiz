name: Make monkey cutout (one time)

on:
  workflow_dispatch:
  push:
    paths:
      - images/monkey_source.png

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rembg[cpu]" pillow
      - name: Remove the background from images/monkey_source.png
        run: |
          python - <<'PY'
          from rembg import remove, new_session
          from PIL import Image
          img = Image.open("images/monkey_source.png").convert("RGB")
          out = remove(img, session=new_session("isnet-general-use"))
          out = out.crop(out.getbbox())
          out.save("images/monkey.png")
          print("monkey.png size", out.size)
          PY
      - run: |
          git config user.name "monkey-quiz-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/monkey.png
          git commit -m "Monkey host cutout" || echo "nothing new"
          git push
