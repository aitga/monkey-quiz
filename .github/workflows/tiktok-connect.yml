name: Connect TikTok (one time)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Paste the TikTok code here"
        required: true

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - run: echo "::add-mask::$CODE"
        env:
          CODE: ${{ inputs.code }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tiktok_connect.py
        env:
          CODE: ${{ inputs.code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
