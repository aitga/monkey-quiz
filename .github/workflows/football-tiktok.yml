name: Football Arena to TikTok

on:
  schedule:
    - cron: "11,41 * * * *"   # every 30 minutes: posts new Football Arena match recaps
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency: football-tiktok

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python football_tiktok.py
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        run: |
          git config user.name "monkey-quiz-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_tiktok_done.json || true
          git commit -m "Football TikTok: remember posted recaps" || echo "nothing to save"
          git pull --rebase origin main
          git push
